<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@4.0.3/src/fcsapi-chart.css"><style>html,body,#fcs_chartparent,#fcs_chart{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#aaa;font:12px sans-serif;background:#050505;z-index:99}.hide{display:none}</style></head><body><div id="fcs_chartparent"><div id="fcs_chart"></div></div><div id="fallback" class="fallback">Enter FCS key above, then tap SAVE KEYS + LOAD CHART</div><script src="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@4.0.3/src/fcsapi-chart.js"></script><script>
let chart=null,lastKey='',lastTicker='FX:EURUSD',lastPeriod='15m',lastSocket='';
function notifyPeriod(p){try{if(window.HOHAAndroid&&HOHAAndroid.onPeriodChanged)HOHAAndroid.onPeriodChanged(String(p||''))}catch(e){}}
function hookPeriod(){if(!chart)return;try{const old=chart.setPeriod&&chart.setPeriod.bind(chart);if(old){chart.setPeriod=function(p){const r=old(p);lastPeriod=String(p||lastPeriod);notifyPeriod(lastPeriod);return r}}}catch(e){}}
function makeChart(){const f=document.getElementById('fallback');f.textContent='Loading '+lastTicker+'…';f.classList.remove('hide');try{if(chart&&chart.destroy)chart.destroy();document.getElementById('fcs_chart').innerHTML='';chart=new FCSAPIChart({container:document.getElementById('fcs_chart'),parentid:'fcs_chartparent',accessKey:lastKey,socketApiKey:lastSocket||undefined,symbol:lastTicker,period:lastPeriod,length:300,theme:'dark',defaultChartType:'candlestick',displayMode:'normal',enableCache:false,changeURL:false,enableSocket:!!lastSocket,enableSidebar:true,enableToolbar:true,enableRangeSelector:true,enableSearch:false,enableIndicators:true,enableMultiChart:false,enableReplay:true,enableCapture:true,enableUndoRedo:true,enableTemplates:true,enableSettings:true,enableDrawingTools:true,enableContextMenu:true,enableCrosshair:true,enablePriceLine:true,enableHighLowLabels:true,enableOHLCBar:true,enableIndicatorLabels:true,enableGrid:true,enableSymbolInfo:true,displayExchangeName:true,enableTimeframeSelector:true,autoScale:true,timezone:'local'});hookPeriod();notifyPeriod(lastPeriod);f.classList.add('hide')}catch(e){f.textContent='Chart error: '+(e.message||e);f.classList.remove('hide')}}
function initLiveChart(key,ticker,period,socketKey){lastKey=key||'';lastTicker=String(ticker||'FX:EURUSD').toUpperCase();lastPeriod=String(period||'15m');lastSocket=socketKey||'';makeChart()}
function loadTicker(ticker,period){lastTicker=String(ticker||lastTicker).toUpperCase();lastPeriod=String(period||lastPeriod);makeChart()}
async function setSignal(j){if(!chart)return;try{chart.clearHorizontalLines();if(!j)return;const s=typeof j==='string'?JSON.parse(j):j;await chart.addHorizontalLine({id:'entry',price:s.entry,label:'ENTRY',style:'solid',lineWidth:2});await chart.addHorizontalLine({id:'sl',price:s.sl,label:'SL',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp1',price:s.tp1,label:'TP1',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp2',price:s.tp2,label:'TP2',style:'dashed',lineWidth:2})}catch(e){}}
window.addEventListener('resize',()=>{if(chart&&chart.resize)chart.resize()});
</script></body></html>
