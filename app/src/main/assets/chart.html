<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#080808;height:100%;overflow:hidden}canvas{width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>let D=[],S=null;function setData(j){D=JSON.parse(j);draw()}function setSignal(j){S=j?JSON.parse(j):null;draw()}function draw(){let c=document.getElementById('c'),x=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#080808';x.fillRect(0,0,w,h);if(!D.length)return;let hi=Math.max(...D.map(a=>a.h)),lo=Math.min(...D.map(a=>a.l));if(S)[S.entry,S.sl,S.tp1,S.tp2].forEach(v=>{hi=Math.max(hi,v);lo=Math.min(lo,v)});let py=v=>10+(hi-v)/(hi-lo||1)*(h-20),step=(w-55)/D.length;D.forEach((a,i)=>{let q=(i+.5)*step,u=a.c>=a.o;x.strokeStyle=u?'#fff':'#777';x.fillStyle=x.strokeStyle;x.beginPath();x.moveTo(q,py(a.h));x.lineTo(q,py(a.l));x.stroke();x.fillRect(q-1.5,Math.min(py(a.o),py(a.c)),3,Math.max(1,Math.abs(py(a.o)-py(a.c))))});if(S){line(S.entry,'ENTRY');line(S.sl,'SL');line(S.tp1,'TP1');line(S.tp2,'TP2')}function line(v,t){let y=py(v);x.strokeStyle='#ddd';x.setLineDash([5,4]);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.setLineDash([]);x.fillStyle='#fff';x.font='10px Arial';x.fillText(t,5,y-3)}}window.onresize=draw;</script></body></html>
