<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#wrap{position:relative;width:100%;height:100%;background:#080808}#canvas{width:100%;height:100%;display:block}#head{position:absolute;left:12px;top:10px;z-index:5;background:rgba(0,0,0,.66);border:1px solid #333;border-radius:10px;padding:7px 10px;font-size:12px}#head b{font-size:14px}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa;font-size:13px;pointer-events:none}.hide{display:none!important}#ohlc{position:absolute;right:10px;top:10px;color:#aaa;font-size:10px;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:8px}</style></head><body><div id="wrap"><canvas id="canvas"></canvas><div id="head"><b id="ticker">HOHA CHART</b><br><span id="period">REST candles</span></div><div id="ohlc"></div><div id="msg">Load a supported instrument from HOHA Instruments</div></div><script>
let candles=[], signal=null, currentTicker='', currentPeriod='';
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),msg=document.getElementById('msg');
function resize(){const d=devicePixelRatio||1;const r=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function renderCandles(j,ticker,period){try{candles=typeof j==='string'?JSON.parse(j):j;currentTicker=ticker||'';currentPeriod=period||'';document.getElementById('ticker').textContent=currentTicker;document.getElementById('period').textContent=currentPeriod+' • '+candles.length+' candles';msg.classList.add('hide');draw()}catch(e){showMessage('Chart data error: '+e.message)}}
function showMessage(t){msg.textContent=t;msg.classList.remove('hide')}
function setSignal(j){try{signal=!j?null:(typeof j==='string'?JSON.parse(j):j);draw()}catch(e){signal=null;draw()}}
function draw(){const w=c.clientWidth,h=c.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h);if(!candles||candles.length<2)return;const left=44,right=10,top=50,bottom=24,pw=w-left-right,ph=h-top-bottom;let lo=Infinity,hi=-Infinity;for(const x of candles){lo=Math.min(lo,+x.l);hi=Math.max(hi,+x.h)}if(signal){for(const k of ['entry','sl','tp1','tp2']){const v=+signal[k];if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}}}if(!isFinite(lo)||!isFinite(hi)||hi<=lo)return;const pad=(hi-lo)*.07||1;lo-=pad;hi+=pad;const y=v=>top+(hi-v)/(hi-lo)*ph;ctx.strokeStyle='#202020';ctx.lineWidth=1;ctx.fillStyle='#777';ctx.font='10px Arial';for(let i=0;i<=5;i++){const yy=top+ph*i/5;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();const p=hi-(hi-lo)*i/5;ctx.fillText(formatPrice(p),2,yy+3)}const n=candles.length,step=pw/n,bw=Math.max(2,Math.min(8,step*.62));for(let i=0;i<n;i++){const x=candles[i],xx=left+step*(i+.5),yo=y(+x.o),yc=y(+x.c),yh=y(+x.h),yl=y(+x.l),up=+x.c>=+x.o;ctx.strokeStyle=up?'#e6e6e6':'#7a7a7a';ctx.fillStyle=up?'#e6e6e6':'#242424';ctx.beginPath();ctx.moveTo(xx,yh);ctx.lineTo(xx,yl);ctx.stroke();ctx.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)));if(!up){ctx.strokeRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))}}
 if(signal){const lines=[['entry','ENTRY'],['sl','SL'],['tp1','TP1'],['tp2','TP2']];for(const [k,lbl] of lines){const v=+signal[k];if(!isFinite(v))continue;const yy=y(v);ctx.save();ctx.setLineDash(k==='entry'?[]:[5,4]);ctx.strokeStyle='#fff';ctx.globalAlpha=k==='entry'?1:.65;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText(lbl+' '+formatPrice(v),left+5,yy-4);ctx.restore()}}
 const last=candles[n-1];document.getElementById('ohlc').textContent='O '+formatPrice(+last.o)+'  H '+formatPrice(+last.h)+'  L '+formatPrice(+last.l)+'  C '+formatPrice(+last.c)}
function formatPrice(v){if(!isFinite(v))return'-';return Math.abs(v)>=100?v.toFixed(2):v.toFixed(5)}
window.addEventListener('resize',resize);setTimeout(resize,50);
</script></body></html>
