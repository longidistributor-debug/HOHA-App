<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@4.0.3/src/fcsapi-chart.css"><style>html,body,#fcs_chartparent,#fcs_chart{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#aaa;font:12px sans-serif;background:#050505}.hide{display:none}</style></head><body><div id="fcs_chartparent"><div id="fcs_chart"></div></div><div id="fallback" class="fallback">Chart loading…</div><script src="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@4.0.3/src/fcsapi-chart.js"></script><script>
let chart=null,lastKey='',lastInput='EURUSD',lastTicker='FX:EURUSD',lastPeriod='15m',lastSocket='';
function normPeriod(p){return p||'15m'}
function cleanSymbol(s){return String(s||'EURUSD').toUpperCase().replace(/[^A-Z0-9:]/g,'')}
async function resolveTicker(key,input){
  const s=cleanSymbol(input); if(s.includes(':')) return s;
  try{
    const u='https://api-v4.fcsapi.com/forex/search?search='+encodeURIComponent(s)+'&per_page=50&access_key='+encodeURIComponent(key);
    const r=await fetch(u); const j=await r.json(); const a=Array.isArray(j.response)?j.response:(Array.isArray(j)?j:[]);
    const exact=a.filter(x=>String(x.symbol||'').toUpperCase()===s);
    const preferred=exact.find(x=>String(x.type||'').toLowerCase()==='commodity')||exact.find(x=>String(x.type||'').toLowerCase()==='forex')||exact[0];
    if(preferred&&preferred.exchange) return String(preferred.exchange).toUpperCase()+':'+s;
  }catch(e){}
  if(/^([A-Z]{6})$/.test(s)) return 'FX:'+s;
  return s;
}
async function initLiveChart(key,symbol,period,socketKey){
  lastKey=key||'';lastInput=cleanSymbol(symbol);lastPeriod=normPeriod(period);lastSocket=socketKey||'';
  const f=document.getElementById('fallback');f.textContent='Resolving '+lastInput+'…';f.classList.remove('hide');
  try{
    lastTicker=await resolveTicker(lastKey,lastInput);
    if(chart&&chart.destroy)chart.destroy();document.getElementById('fcs_chart').innerHTML='';
    chart=new FCSAPIChart({container:document.getElementById('fcs_chart'),parentid:'fcs_chartparent',accessKey:lastKey,socketApiKey:lastSocket||undefined,symbol:lastTicker,period:lastPeriod,length:180,theme:'dark',defaultChartType:'candlestick',displayMode:'normal',enableCache:true,changeURL:false,enableSocket:!!lastSocket,enableSearch:true,enableIndicators:true,enableDrawingTools:true,enableCrosshair:true,enableCrosshairLabels:true,enablePriceLine:true,enableOHLCBar:true,enableIndicatorLabels:true,enableGrid:true,enableSymbolInfo:true,displayExchangeName:true,searchModalTabs:{all:'All',forex:'Forex',commodity:'Commodities'}});
    f.classList.add('hide');
  }catch(e){f.textContent='Chart could not load '+lastInput+'. Analysis can still use REST history. '+(e.message||'');f.classList.remove('hide')}
}
async function changeMarket(symbol,period){lastInput=cleanSymbol(symbol);lastPeriod=normPeriod(period);await initLiveChart(lastKey,lastInput,lastPeriod,lastSocket)}
async function setSignal(j){if(!chart)return;try{chart.clearHorizontalLines();if(!j)return;const s=typeof j==='string'?JSON.parse(j):j;await chart.addHorizontalLine({id:'entry',price:s.entry,label:'ENTRY',style:'solid',lineWidth:2});await chart.addHorizontalLine({id:'sl',price:s.sl,label:'SL',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp1',price:s.tp1,label:'TP1',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp2',price:s.tp2,label:'TP2',style:'dashed',lineWidth:2})}catch(e){}}
window.addEventListener('resize',()=>{if(chart&&chart.resize)chart.resize()});
</script></body></html>
