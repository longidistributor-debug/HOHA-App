mbol);chart.setPeriod(lastPeriod)}catch(e){initLiveChart(lastKey,symbol,period,'')}}}async function setSignal(j){if(!chart)return;try{chart.clearHorizontalLines();if(!j)return;const s=typeof j==='string'?JSON.parse(j):j;await chart.addHorizontalLine({id:'entry',price:s.entry,label:'ENTRY',style:'solid',lineWidth:2});await chart.addHorizontalLine({id:'sl',price:s.sl,label:'SL',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp1',price:s.tp1,label:'TP1',style:'dashed',lineWidth:2});await chart.addHorizontalLine({id:'tp2',price:s.tp2,label:'TP2',style:'dashed',lineWidth:2})}catch(e){}}function refreshChart(){if(chart&&chart.setSymbol){try{chart.setSymbol(lastSymbol)}catch(e){}}}window.addEventListener('resize',()=>{if(chart&&chart.resize)chart.resize()});</script></body></html>
